<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404: Page Not Found | Raman Kumar Sharma</title>
  <!-- Single Page Apps for GitHub Pages redirect script (MIT License: https://github.com/rafgraph/spa-github-pages) -->
  <!-- pathSegmentsToKeep: 0 for custom root domain deployment (https://alex.runs-on.dev/) -->
  <script>
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center;">
  <div style="max-width: 480px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 40px 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);">
    <h1 style="font-size: 2.2rem; margin: 0 0 12px; font-weight: 800; color: #0f172a;">404: Route Unresolved</h1>
    <p style="color: #64748b; font-size: 1rem; line-height: 1.6; margin: 0 0 24px;">The requested URL was not found on this portfolio server.</p>
    <a href="/" style="display: inline-block; background: #0284c7; color: #ffffff; text-decoration: none; padding: 10px 24px; border-radius: 9999px; font-weight: 600; font-size: 0.95rem;">Return to Homepage</a>
  </div>
</body>
</html>
